set -g default-terminal "screen-256color"
set -g default-terminal "xterm"
set -g xterm-keys on

# ==========
# change default prefix (C-b) to C-a
# ==========
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# start numbering from 0 instead of 1
set -g base-index 0
setw -g pane-base-index 0

# next previous window
bind-key -n F9 previous-window
bind-key -n F10 next-window
bind -n C-p previous-window
bind -n C-n next-window

# clear term 
bind-key C-b send-keys "clear && tmux clear-history" \; send-keys "Enter"

# save history in tmux.history file
bind-key C-s command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'

# get rid of delay reading command characters while tmux waits for escape sequence
set -s escape-time 1

# reload ~/.tmux.conf using prefix r
 bind r source-file ~/.tmux.conf \; display "tmux reloaded"

# change split prefixes (horizontal: C-space /) (vertical: C-space -)
bind / split-window -h
bind - split-window -v

# zoom
bind-key -n C-z resize-pane -Z

# make current window the 1st window
bind T swap-window -t 1

# set scrollback history to 50K lines
set -g history-limit 99999

# ==========
# mouse support
# ==========
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M; send-keys -M; send-keys -M; send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M; send-keys -M; send-keys -M; send-keys -M' 'copy-mode -e; send-keys -M; send-keys -M; send-keys -M; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M; send-keys -M; send-keys -M; send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M; send-keys -M; send-keys -M; send-keys -M' 'copy-mode -e; send-keys -M; send-keys -M; send-keys -M; send-keys -M'"

# ==========
# Movement
# ==========
# Ctrl + Arrow keys: handled below with vim-awareness (lines 76-79)

# move windows +/-1
bind-key -n S-Left swap-window -t -1
bind-key -n S-Right swap-window -t +1

# Smart pane switching with awareness of Vim splits.
 # See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '(view|nvim|vim|vi)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n C-Left if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-h" "resize-pane -Z ; select-pane -L"
bind-key -n C-Down if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-j" "resize-pane -Z ; select-pane -D"
bind-key -n C-Up if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-k" "resize-pane -Z ; select-pane -U"
bind-key -n C-Right if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-l" "resize-pane -Z ; select-pane -R"
#bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-Left select-pane -L
bind-key -T copy-mode-vi C-Down select-pane -D
bind-key -T copy-mode-vi C-Up select-pane -U
bind-key -T copy-mode-vi C-Right select-pane -R
#bind-key -T copy-mode-vi C-\ select-pane -l

# ==========
# copy mode
# ==========

setw -g mode-keys vi
set -g status-keys vi

# Make double and triple click work outside of copy mode (already works inside it with default bindings).
#bind-key -T root DoubleClick1Pane if-shell -Ft{mouse} '#{alternate_on}' "send-keys -M" "copy-mode -t{mouse}; send-keys -t{mouse} -X select-word"
#bind-key -T root TripleClick1Pane if-shell -Ft{mouse} '#{alternate_on}' "send-keys -M" "copy-mode -t{mouse}; send-keys -t{mouse} -X select-line"

# For those times when C-c and q are not enough.
bind-key -T copy-mode-vi Escape send-keys -X cancel

# setup 'v' to begin selection as in vim
# New 2.4 version:
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down<Paste>

# update default binding of `Enter` to also use copy-pipe (os x)
bind-key -T copy-mode 'Enter' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# bind ] to use pbpaste
bind ] run "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"

bind-key C-v copy-mode
bind-key C-p run "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"

# ==========
# status bar
# ==========

# set status bar
set -g status-interval 15
set -g status-justify left
set -g status-left ""
set -g status-right '#[fg="#2B9710"]#H'

# LazyVim Catppuccin Mocha colors
set -g status-bg "#1c1c1c"
set -g status-fg "#E3E3E3"

# Status right
set -g status-right-length 250
set -g status-right '#{?client_prefix,#[fg="#1c1c1c",bg="#F92672",bold]<Prefix>#[default] ,} #[fg="#2B9710",bold]| #[fg="#AFAFAF"]#(~/bin/i3/show_language) #[fg="#2B9710"]| #[fg="#E3E3E3"]%d %b %R '

set-option -g set-titles on

#setw -g window-status-current-fg "#2B9710"
#setw -g window-status-current-bg "#494949"
#setw -g window-status-current-attr bold
setw -g window-status-current-format ' #[fg="#AFAFAF"]#I#[fg="#399CC6"]:#[fg="#E3E3E3",bold]#W#[fg="#F92672"]#F '

#setw -g window-status-fg "#8E8E8E"
#setw -g window-status-attr bold
setw -g window-status-format ' #[fg="#AFAFAF"]#I#[fg="#8E8E8E"]:#[fg="#CFCFCF"]#W#[fg="#8E8E8E"]#F '

# quiet!
# http://unix.stackexchange.com/questions/169992/why-are-my-windows-highlighted-when-i-first-open-tmux
setw -g monitor-activity off
set -g monitor-silence 0
set -g bell-action none

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-capture-pane-contents 'on'

TMUX_FZF_LAUNCH_KEY="C-f"
run '~/.tmux/plugins/tpm/tpm'
